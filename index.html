<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --bg-color: #050505; /* Slightly softer black */
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND CANVAS --- */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Behind content */
            pointer-events: none;
        }

        /* --- MAIN CONTENT CONTAINER --- */
        .content-wrapper {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Subtle breathing animation after load */
            animation: gentleFloat 6s ease-in-out infinite;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -2.5px;
            line-height: 1;
            margin-bottom: 1.5rem;
            
            /* Dynamic Gradient Shimmer Effect */
            background: linear-gradient(
                110deg, 
                #888888 0%, 
                #ffffff 25%, 
                #888888 50%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: 
                fadeUp 1.2s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards,
                shimmerText 8s linear infinite; /* Continuous shimmer */
            
            opacity: 0; /* Start hidden for entry animation */
        }

        p {
            color: var(--text-secondary);
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1.2s cubic-bezier(0.215, 0.610, 0.355, 1.000) 0.3s forwards;
        }

        /* --- ANIMATIONS --- */
        /* Entry animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* Text gradient movement */
        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        /* Entire container floating gently */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="content-wrapper">
        <h1>Coming soon!</h1>
        <p>Expect in January.</p>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 80; // Number of particles
        const particleColor = 'rgba(255, 255, 255, 0.3)'; // Subtle white
        const connectionDistance = 100; // Distance to draw lines between particles

        // Set canvas size
        function setSize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio; // Handle high-DPI displays
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        // Particle Class
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5; // Size between 0.5 and 2.5
                this.speedX = Math.random() * 0.6 - 0.3; // Slow random movement X
                this.speedY = Math.random() * 0.6 - 0.3; // Slow random movement Y
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap around screen edges
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                if (this.y < 0) this.y = height;
            }

            draw() {
                ctx.fillStyle = particleColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Optional: Subtle background gradient pulse on the canvas
            const time = Date.now() * 0.001;
            const pulse = Math.sin(time) * 0.1 + 0.9;
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            gradient.addColorStop(0, `rgba(30, 30, 40, ${0.3 * pulse})`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0,0,width,height);


            // Update and draw particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Optional: Draw faint lines between nearby particles
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        const opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.15})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Events
        window.addEventListener('resize', () => {
            setSize();
            initParticles(); // Re-init to avoid stretching
        });

        // Start
        setSize();
        initParticles();
        animate();

    </script>
</body>
</html>
