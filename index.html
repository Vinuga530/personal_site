<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon</title>
    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --bg: #050505;
            --text-main: #ffffff;
            --text-sub: #888888;
            --font-stack: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            overscroll-behavior: none;
        }

        /* --- BACKGROUND LAYERS --- */
        .noise-overlay {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
            z-index: 2;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- CONTENT --- */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: transparent;
            /* Subtle shimmer gradient */
            background: linear-gradient(120deg, #ffffff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            
            opacity: 0;
            transform: translateY(20px);
            animation: textReveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        p {
            font-size: clamp(1rem, 4vw, 1.25rem);
            color: var(--text-sub);
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            
            opacity: 0;
            transform: translateY(10px);
            animation: textReveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
        }

        @keyframes textReveal {
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Film Grain Texture -->
    <div class="noise-overlay"></div>

    <!-- Particle System -->
    <canvas id="canvas"></canvas>

    <!-- Content -->
    <div class="content">
        <h1>Coming soon!</h1>
        <p>Expect in January.</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Mouse/Touch state
        let mouse = { x: undefined, y: undefined, radius: 150 };

        // --- RESIZE HANDLING ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            // Set canvas resolution to match pixel density for crisp rendering
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            initParticles();
        }

        // --- INTERACTION HANDLING ---
        function updateMouse(x, y) {
            mouse.x = x;
            mouse.y = y;
        }

        window.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            // Prevent scrolling on mobile when interacting
            e.preventDefault(); 
            updateMouse(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        
        window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; });
        window.addEventListener('touchend', () => { mouse.x = undefined; mouse.y = undefined; });
        window.addEventListener('resize', resize);

        // --- PARTICLE LOGIC ---
        class Particle {
            constructor() {
                this.init(true);
            }

            init(randomY = false) {
                this.x = Math.random() * width;
                // If randomY is true, place anywhere (start). If false, place at bottom (respawn)
                this.y = randomY ? Math.random() * height : height + 10;
                
                // Varied sizes for depth
                this.radius = Math.random() * 2 + 0.5; 
                
                // Opacity based on size (smaller = fainter/further away)
                this.maxOpacity = this.radius / 3; 
                this.opacity = Math.random() * this.maxOpacity;
                
                // Speed is faster for larger particles (parallax feel)
                this.velocity = {
                    x: (Math.random() - 0.5) * 0.5,
                    y: -(Math.random() * 0.5 + 0.2) // Always floating up
                };

                // Store original velocity for smooth return
                this.baseVelocityY = this.velocity.y;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                // Soft white glow
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                // Subtle shadow for glow effect
                ctx.shadowBlur = this.radius * 2;
                ctx.shadowColor = "white";
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }

            update() {
                // 1. Basic Movement
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // 2. Interaction (Gentle Wind)
                if (mouse.x) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        
                        // Push away gently
                        const pushStrength = 2; // Low value for smoothness
                        this.velocity.x -= forceDirectionX * force * pushStrength * 0.05;
                        this.velocity.y -= forceDirectionY * force * pushStrength * 0.05;
                    }
                }

                // 3. Friction/Restoration (Return to normal speed)
                // Slowly bring x velocity back to near 0
                if (this.velocity.x > 0.5) this.velocity.x -= 0.02;
                else if (this.velocity.x < -0.5) this.velocity.x += 0.02;
                
                // Slowly bring y velocity back to base float speed
                if (this.velocity.y < this.baseVelocityY) this.velocity.y += 0.01;
                
                // 4. Twinkle Effect
                // Randomly pulsate opacity
                if (Math.random() > 0.95) {
                   this.opacity += (Math.random() - 0.5) * 0.05;
                   // Clamp opacity
                   if (this.opacity < 0) this.opacity = 0;
                   if (this.opacity > this.maxOpacity) this.opacity = this.maxOpacity;
                }

                // 5. Reset if out of bounds
                if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                    this.init(false); // Respawn at bottom
                }
            }
        }

        function initParticles() {
            particles = [];
            // Calculate density: fewer on mobile
            const particleCount = width < 600 ? 50 : 100;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Clear rect
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
        }

        // --- START ---
        resize();
        animate();

    </script>
</body>
</html>
