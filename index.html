<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon</title>
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg: #030303;
            --text-main: #ffffff;
            --text-sub: #888888;
            --font-stack: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-stack);
            /* Use dynamic viewport height for mobile browsers */
            height: 100vh;
            height: 100dvh; 
            width: 100%;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            /* Prevent bounce effect on iOS */
            overscroll-behavior: none;
        }

        /* --- LAYER 1: FILM GRAIN TEXTURE --- */
        .noise-overlay {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.07;
            pointer-events: none;
            z-index: 2;
            animation: noise-move 0.4s infinite linear;
        }

        @keyframes noise-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(10px, 10px); }
        }

        /* --- LAYER 2: CANVAS (PARTICLES) --- */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            touch-action: none; /* Disable default touch actions */
        }

        /* --- LAYER 3: CONTENT --- */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%; /* Prevent text hitting edges */
            max-width: 800px;
            transform-style: preserve-3d;
            will-change: transform;
            padding: 20px;
        }

        h1 {
            /* Responsive typography: minimum 2.5rem, preferred 10vw, max 7rem */
            font-size: clamp(2.5rem, 10vw, 7rem); 
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: transparent;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            
            opacity: 0;
            filter: blur(20px);
            transform: scale(0.9) translateY(30px);
            animation: cinematicReveal 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        p {
            /* Responsive subtitle */
            font-size: clamp(0.9rem, 3vw, 1.5rem);
            color: var(--text-sub);
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s cubic-bezier(0.19, 1, 0.22, 1) 0.6s forwards;
        }

        /* --- KEYFRAMES --- */
        @keyframes cinematicReveal {
            to { opacity: 1; filter: blur(0); transform: scale(1) translateY(0); }
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <canvas id="canvas"></canvas>

    <div class="content" id="tilt-card">
        <h1>Coming soon!</h1>
        <p>Expect in January.</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const content = document.getElementById('tilt-card');
        
        let width, height;
        let particles = [];
        
        // Mouse/Touch state
        const mouse = { x: null, y: null, radius: 150 };

        // --- RESIZE HANDLER ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Re-initialize particles on resize to prevent distortion
            initParticles();
        }
        window.addEventListener('resize', resize);

        // --- INPUT HANDLING (MOUSE & TOUCH) ---
        
        function handleMove(x, y) {
            mouse.x = x;
            mouse.y = y;

            // Parallax Tilt
            const centerX = width / 2;
            const centerY = height / 2;
            const xOffset = (x - centerX) / centerX;
            const yOffset = (y - centerY) / centerY;

            // Reduce tilt intensity on mobile for smoother feel
            const intensity = width < 600 ? 5 : 10; 
            const rotateX = yOffset * -intensity;
            const rotateY = xOffset * intensity;
            
            content.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        function handleLeave() {
            mouse.x = null;
            mouse.y = null;
            content.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        }

        // Mouse Events
        window.addEventListener('mousemove', (e) => handleMove(e.x, e.y));
        window.addEventListener('mouseleave', handleLeave);

        // Touch Events
        window.addEventListener('touchmove', (e) => {
            // Prevent scrolling while touching canvas
            e.preventDefault(); 
            const touch = e.touches[0];
            handleMove(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchend', handleLeave);


        // --- PARTICLE SYSTEM ---
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.1;
                this.baseX = this.x;
                this.baseY = this.y;
                // Lighter particles for mobile performance
                this.density = (Math.random() * 30) + 1; 
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    
                    const maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 20;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 20;
                        }
                    }
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 20;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 20;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            // Adjust density based on screen size (fewer particles on mobile for performance)
            const densityDivisor = width < 600 ? 15000 : 9000;
            const numberOfParticles = (width * height) / densityDivisor;
            
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw Spotlight
            if (mouse.x != null) {
                // Smaller spotlight on mobile
                const spotRadius = width < 600 ? 150 : 300;
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, spotRadius);
                gradient.addColorStop(0, 'rgba(40, 40, 60, 0.4)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
            }

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.update();
                p.draw();
                
                // Draw connections
                for (let j = i; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    // Shorter connection distance on mobile
                    const connectDist = width < 600 ? 60 : 100;

                    if (distance < connectDist) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${1 - distance/connectDist})`; 
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Boot
        resize();
        animate();
        
    </script>
</body>
</html>
